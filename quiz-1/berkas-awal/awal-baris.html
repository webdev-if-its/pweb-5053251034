<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Baris Kotak</title>
  <style>
    .baris {
      display: flex;
      justify-content: space-between;
      margin: 12px;
    }

    .kotak {
      width: 180px;
      height: 180px;
      background-color: #ef4444;
      color: white;
      display: flex;
      justify-content: center;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <section class="baris">
    <div class="kotak">Satu</div>
    <div class="kotak">Dua</div>
    <div class="kotak">Tiga</div>
    <div class="kotak">Empat</div>
  </section>
</body>
</html>
